<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiMAS - Digitalisasi MCSP Arsip Sistem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16274A;
  --navy-light:#1F3A63;
  --navy-lighter:#2C4E80;
  --gold:#C9972F;
  --gold-dark:#A8791E;
  --gold-bg:#FBF1DD;
  --bg:#F3F5F9;
  --surface:#FFFFFF;
  --border:#E2E6ED;
  --border-strong:#CBD2DE;
  --text-primary:#182238;
  --text-secondary:#5B6472;
  --text-muted:#8A93A3;
  --success:#2E7D5B;
  --success-bg:#E5F3EC;
  --danger:#B3432B;
  --danger-bg:#FBEAE5;
  --info:#2C6E9B;
  --info-bg:#E7F1F8;
  --radius:10px;
  --shadow:0 1px 2px rgba(22,39,74,0.06), 0 1px 8px rgba(22,39,74,0.05);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-display{font-family:'Plus Jakarta Sans',sans-serif;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
::selection{background:var(--gold-bg); color:var(--navy);}

/* ---------- LOGIN ---------- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(201,151,47,0.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(31,58,99,0.12), transparent 45%),
    var(--navy);
  padding:20px;
}
.login-card{
  width:100%; max-width:380px; background:var(--surface); border-radius:16px;
  padding:36px 32px 32px; box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.login-logo{
  width:52px; height:52px; border-radius:12px; background:var(--navy);
  display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  color:var(--gold); font-family:'Plus Jakarta Sans'; font-weight:800; font-size:20px;
}
.login-card h1{font-size:22px; font-weight:700; color:var(--navy); margin-bottom:4px;}
.login-card p.sub{color:var(--text-secondary); font-size:13px; margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; letter-spacing:.2px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:8px;
  background:#fff; color:var(--text-primary); outline:none; transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--navy-lighter); box-shadow:0 0 0 3px rgba(31,58,99,0.12);
}
.field-hint{font-size:11.5px; color:var(--text-muted); margin-top:5px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:38px;}
.pw-toggle{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); padding:4px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 16px; border-radius:8px; border:1px solid transparent; font-weight:600; font-size:13.5px;
  transition:all .15s; white-space:nowrap;
}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-light);}
.btn-gold{background:var(--gold); color:#3A2A05;}
.btn-gold:hover{background:var(--gold-dark); color:#fff;}
.btn-outline{background:#fff; border-color:var(--border-strong); color:var(--text-primary);}
.btn-outline:hover{background:var(--bg); border-color:var(--navy-lighter);}
.btn-danger-outline{background:#fff; border-color:#E4B7AA; color:var(--danger);}
.btn-danger-outline:hover{background:var(--danger-bg);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}
.btn-icon{padding:7px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.login-error{
  background:var(--danger-bg); color:var(--danger); font-size:12.5px; padding:9px 12px;
  border-radius:8px; margin-bottom:16px; display:flex; gap:8px; align-items:flex-start;
}
.login-hint-box{
  margin-top:22px; padding:12px 14px; background:var(--bg); border-radius:10px; border:1px dashed var(--border-strong);
  font-size:11.5px; color:var(--text-secondary); line-height:1.6;
}
.login-hint-box b{color:var(--text-primary);}

/* ---------- APP SHELL ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:260px; background:var(--navy); color:#fff; flex-shrink:0;
  display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:40;
  transition:transform .22s ease;
}
.sidebar.closed{transform:translateX(-100%);}
.sidebar-head{padding:20px 20px 16px; display:flex; align-items:center; gap:11px; border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-logo{width:38px; height:38px; border-radius:9px; background:var(--gold); color:var(--navy); display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans'; font-weight:800; font-size:15px; flex-shrink:0;}
.sidebar-head .name{font-family:'Plus Jakarta Sans'; font-weight:700; font-size:15.5px; line-height:1.2;}
.sidebar-head .tag{font-size:10.5px; color:rgba(255,255,255,0.55); letter-spacing:.3px; margin-top:2px;}
.sidebar-nav{flex:1; padding:14px 12px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:rgba(255,255,255,0.72);
  font-weight:500; font-size:13.8px; margin-bottom:3px; cursor:pointer; transition:background .15s, color .15s; border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-item.active{background:var(--gold); color:#3A2A05; font-weight:700;}
.nav-item svg{flex-shrink:0;}
.sidebar-foot{padding:14px 20px 20px; border-top:1px solid rgba(255,255,255,0.08);}
.user-chip{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.user-avatar{width:34px; height:34px; border-radius:50%; background:var(--navy-lighter); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; flex-shrink:0;}
.user-chip .uname{font-size:13px; font-weight:600; color:#fff; line-height:1.2;}
.user-chip .urole{font-size:11px; color:rgba(255,255,255,0.55);}
.logout-btn{width:100%; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,0.08); color:#fff; border:none; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;}
.logout-btn:hover{background:rgba(255,255,255,0.16);}

.overlay{position:fixed; inset:0; background:rgba(10,16,30,0.45); z-index:35; display:none;}
.overlay.show{display:block;}

.main{flex:1; margin-left:260px; display:flex; flex-direction:column; min-height:100vh; transition:margin .22s ease;}
.main.full{margin-left:0;}
.topbar{
  height:60px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center;
  padding:0 22px; gap:14px; position:sticky; top:0; z-index:20;
}
.hamburger{background:none; border:1px solid var(--border-strong); border-radius:8px; padding:8px; display:flex; color:var(--text-primary);}
.hamburger:hover{background:var(--bg);}
.topbar h2{font-size:16.5px; font-weight:700; color:var(--navy);}
.topbar .breadcrumb{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
.topbar-spacer{flex:1;}
.topbar-user{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text-secondary); padding-left:14px; border-left:1px solid var(--border);}
.topbar-user b{color:var(--text-primary);}
.badge-role{font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; letter-spacing:.3px;}
.badge-role.admin{background:var(--gold-bg); color:var(--gold-dark);}
.badge-role.user{background:var(--info-bg); color:var(--info);}

.content{padding:24px; flex:1;}
.page-title{font-size:20px; font-weight:700; color:var(--navy); margin-bottom:2px;}
.page-desc{font-size:13px; color:var(--text-secondary); margin-bottom:20px;}

/* ---------- CARDS / GRID ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{padding:16px 18px;}
.stat-label{font-size:11.5px; color:var(--text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:.3px; margin-bottom:8px;}
.stat-value{font-size:26px; font-weight:800; font-family:'Plus Jakarta Sans'; color:var(--navy);}
.stat-sub{font-size:11.5px; color:var(--text-muted); margin-top:4px;}
.stat-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;}

.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
.toolbar .grow{flex:1; min-width:180px;}
.search-box{position:relative;}
.search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-muted);}
.search-box input{padding-left:34px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;
  color:var(--text-secondary); padding:10px 12px; border-bottom:2px solid var(--border); background:#FAFBFD; white-space:nowrap;
}
tbody td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:#FAFBFD;}
.table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); background:#fff;}
.table-wrap table{border:none;}
.table-wrap thead th:first-child{border-top-left-radius:var(--radius);}
.table-empty{text-align:center; padding:40px 20px; color:var(--text-muted);}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.pill-success{background:var(--success-bg); color:var(--success);}
.pill-danger{background:var(--danger-bg); color:var(--danger);}
.pill-muted{background:var(--bg); color:var(--text-secondary); border:1px solid var(--border-strong);}
.pill-area{background:#EEF1F7; color:var(--navy); font-weight:600; font-size:11px;}
.pill-lock{background:var(--bg); color:var(--text-muted); font-size:11px; font-weight:600;}

.area-card{
  border:1px solid var(--border); border-radius:12px; padding:15px 16px; background:#fff; cursor:pointer;
  border-left:4px solid var(--c); transition:box-shadow .15s, transform .15s;
}
.area-card:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
.area-card.active{box-shadow:0 0 0 2px var(--c) inset; background:#FAFBFD;}
.area-card .an{font-weight:700; font-size:13px; color:var(--text-primary); margin-bottom:10px; line-height:1.3; min-height:34px;}
.area-card .arow{display:flex; align-items:center; justify-content:space-between;}
.area-card .acount{font-size:20px; font-weight:800; font-family:'Plus Jakarta Sans'; color:var(--navy);}
.area-card .apct{font-size:12px; font-weight:700;}
.bar-track{height:6px; border-radius:4px; background:var(--border); margin-top:8px; overflow:hidden;}
.bar-fill{height:100%; border-radius:4px;}

.ring{width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;}
.ring-inner{width:70px; height:70px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-inner b{font-size:18px; font-family:'Plus Jakarta Sans'; color:var(--navy);}
.ring-inner span{font-size:9.5px; color:var(--text-muted); font-weight:600;}

.section-title{font-size:14.5px; font-weight:700; color:var(--navy); margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}

.chip{display:inline-flex; align-items:center; padding:3px 9px; border-radius:6px; background:var(--bg); border:1px solid var(--border-strong); font-size:11px; font-weight:600; color:var(--text-secondary); margin:2px 3px 2px 0;}

/* ---------- FORMS / MODAL ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(10,16,30,0.5); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:36px 16px; overflow-y:auto;}
.modal-box{background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:0 24px 70px rgba(0,0,0,0.3); animation:modalIn .15s ease;}
@keyframes modalIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-size:16px; font-weight:700; color:var(--navy);}
.modal-close{background:none; border:none; color:var(--text-muted); padding:5px; border-radius:6px;}
.modal-close:hover{background:var(--bg); color:var(--text-primary);}
.modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:520px){.form-row{grid-template-columns:1fr;}}
.check-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media(max-width:480px){.check-grid{grid-template-columns:1fr;}}
.check-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:8px; font-size:12.5px;}
.check-item input{width:auto;}
.alert{padding:10px 13px; border-radius:8px; font-size:12.5px; display:flex; gap:9px; align-items:flex-start; line-height:1.5;}
.alert-info{background:var(--info-bg); color:#1D4E70;}
.alert-warn{background:var(--danger-bg); color:var(--danger);}
.alert-gold{background:var(--gold-bg); color:#6B4E0F;}
.locked-field{background:var(--bg); padding:10px 12px; border-radius:8px; border:1px solid var(--border); font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:8px;}
.file-drop{border:1.5px dashed var(--border-strong); border-radius:10px; padding:18px; text-align:center; color:var(--text-secondary); font-size:12.5px; cursor:pointer;}
.file-drop:hover{border-color:var(--navy-lighter); background:#FAFBFD;}
.file-chip{display:inline-flex; align-items:center; gap:7px; background:var(--info-bg); color:#1D4E70; padding:6px 11px; border-radius:8px; font-size:12px; font-weight:600; margin-top:8px;}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-muted);}
.empty-state svg{margin-bottom:12px; opacity:.5;}
.empty-state h4{color:var(--text-secondary); font-size:14px; margin-bottom:4px;}
.empty-state p{font-size:12.5px;}

.eye-btn{background:none; border:none; color:var(--text-muted); padding:3px; display:inline-flex; vertical-align:middle;}
.eye-btn:hover{color:var(--navy);}
.mono{font-family:monospace; letter-spacing:.5px;}

.filter-note{font-size:11.5px; color:var(--text-muted); margin-bottom:14px; display:flex; align-items:center; gap:6px;}

/* Laporan bars */
.rep-bar-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.rep-bar-row:last-child{border-bottom:none;}
.rep-bar-label{width:220px; flex-shrink:0; font-size:12.5px; font-weight:600;}
.rep-bar-track{flex:1; height:16px; background:var(--bg); border-radius:5px; overflow:hidden; position:relative;}
.rep-bar-fill{height:100%; border-radius:5px; display:flex; align-items:center; justify-content:flex-end; transition:width .3s;}
.rep-bar-num{width:90px; text-align:right; font-size:12px; font-weight:700; color:var(--text-secondary); flex-shrink:0;}

/* Print */
#reportPrintArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #reportPrintArea, #reportPrintArea *{visibility:visible;}
  #reportPrintArea{display:block !important; position:absolute; left:0; top:0; width:100%; padding:20px;}
  .no-print{display:none !important;}
}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
}
.scroll-x{overflow-x:auto;}
</style>
</head>

<script>

    {id:'u6', username:'galih.bkpsdm', password:'bkpsdm2026', name:'Galih Prasetyo', role:'user', organisasi:'Badan Kepegawaian dan Pengembangan Sumber Daya Manusia (BKPSDM)', areas:['asn']},

function uid(prefix){return prefix+'_'+Math.random().toString(36).slice(2,9);}
function todayStr(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}
function nowStr(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getUser(id){return DB.users.find(u=>u.id===id);}
function isAdmin(u){return u && u.role==='admin';}
function accessibleAreas(u){
  if(!u) return [];
  if(isAdmin(u)) return AREAS;
  return AREAS.filter(a=>u.areas.includes(a.id));
}
function initials(name){
  return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function logAct(aksi, detail){
  DB.activity.unshift({id:uid('a'), waktu:nowStr(), user:STATE.currentUser?STATE.currentUser.name:'-', aksi, detail});
}
function visibleDocuments(){
  const u=STATE.currentUser;
  if(!u) return [];
  const areaIds = accessibleAreas(u).map(a=>a.id);
  let docs = DB.documents.filter(d=>areaIds.includes(d.area));
  if(!isAdmin(u)) docs = docs.filter(d=>d.picUserId===u.id);
  return docs;
}

function doLogin(e){
  e.preventDefault();
  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value;
  const user = DB.users.find(u=>u.username===username && u.password===password);
  if(!user){
    STATE.loginError = 'Username atau password salah. Silakan coba lagi.';
    render();
    return false;
  }
  STATE.loginError='';
  STATE.currentUser = user;
  STATE.page='dashboard';
  STATE.dashboard.year=2026;
  STATE.dashboard.area = isAdmin(user) ? 'all' : (user.areas[0]||'all');
  logAct('Login', 'Masuk ke sistem sebagai '+(isAdmin(user)?'Admin Utama':'Pengguna'));
  render();
  return false;
}
function doLogout(){
  logAct('Logout', 'Keluar dari sistem');
  STATE.currentUser=null;
  STATE.page='dashboard';
  render();
}

  const yearOptions = YEARS.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('');

  // scope docs: role-based visibility + selected year

  if(!admin) docsAll = docsAll.filter(d=>d.picUserId===u.id);

  const scopedDocs = areaSel==='all' ? docsAll : docsAll.filter(d=>d.area===areaSel);
  const total = scopedDocs.length;
  const lengkap = scopedDocs.filter(d=>d.status==='Lengkap').length;
  const belum = total-lengkap;
  const target = areaSel==='all' ? myAreas.reduce((s,a)=>s+getTarget(year,a.id),0) : getTarget(year,areaSel);
  const pct = total>0 ? Math.round(lengkap/total*100) : 0;
  const targetPct = target>0 ? Math.min(100, Math.round(total/target*100)) : 0;

  const areaCardsHtml = myAreas.map(a=>{
    let ad = docsAll.filter(d=>d.area===a.id);
    const at=ad.length, al=ad.filter(d=>d.status==='Lengkap').length;
    const ap = at>0?Math.round(al/at*100):0;

      <div class="stat-label">Total Dokumen</div>
      <div class="stat-value">${total}</div>
      <div class="stat-sub">Tahun ${year} ${areaSel==='all'?'&middot; semua area':'&middot; '+esc(areaName(areaSel))}</div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon" style="background:var(--success-bg); color:var(--success);">${ICONS.check}</div>
      <div class="stat-label">Dokumen Lengkap</div>
      <div class="stat-value">${lengkap}</div>
      <div class="stat-sub">${pct}% dari dokumen terinput</div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon" style="background:var(--danger-bg); color:var(--danger);">${ICONS.alert}</div>
      <div class="stat-label">Belum Lengkap</div>

      <div class="stat-label">Realisasi vs Target</div>
      <div class="stat-value">${total}/${target}</div>
      <div class="stat-sub">${targetPct}% dari target ${year}</div>
    </div>
  </div>

  <div class="card card-pad" style="margin-bottom:22px; display:flex; align-items:center; gap:22px; flex-wrap:wrap;">

        Dari ${total} dokumen yang terinput pada tahun ${year}, <b style="color:var(--success)">${lengkap} dokumen</b> telah dinyatakan lengkap oleh Admin Utama dan <b style="color:var(--danger)">${belum} dokumen</b> masih memerlukan kelengkapan berkas.

function setDashArea(id){
  STATE.dashboard.area = (STATE.dashboard.area===id) ? 'all' : id;

}

/* ============================================================
   PAGE: DATA DOKUMEN
   ============================================================ */
function pageDokumen(){
  if(STATE.dokumen.view==='form') return dokumenFormView();
  const u=STATE.currentUser;
  const admin=isAdmin(u);
  const myAreas = accessibleAreas(u);
  const f = STATE.dokumen;

  let docs = visibleDocuments();
  if(f.area!=='all') docs = docs.filter(d=>d.area===f.area);
  if(f.status!=='all') docs = docs.filter(d=>d.status===f.status);
  if(f.search.trim()){
    const q=f.search.trim().toLowerCase();
    docs = docs.filter(d=> d.namaDokumen.toLowerCase().includes(q) || (getUser(d.picUserId)?.name||'').toLowerCase().includes(q));
  }
  docs = docs.slice().sort((x,y)=> y.tahun-x.tahun || y.id.localeCompare(x.id));

  const areaOptions = `<option value="all">Semua Area</option>` + myAreas.map(a=>`<option value="${a.id}" ${f.area===a.id?'selected':''}>${esc(a.name)}</option>`).join('');

  const driveCard = (admin && f.area!=='all') ? `
    <div class="card card-pad" style="margin-bottom:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <div class="stat-icon" style="background:var(--info-bg); color:var(--info); margin:0;">${ICONS.folder}</div>
      <div style="flex:1; min-width:200px;">
        <div style="font-weight:700; font-size:13px; color:var(--navy);">Folder Google Drive &mdash; ${esc(areaName(f.area))}</div>
        <div style="font-size:11.5px; color:var(--text-muted);">Terhubung ke akun ${DRIVE_ACCOUNT} &middot; hanya terlihat oleh Admin Utama</div>
      </div>
      <a class="btn btn-outline btn-sm" href="${driveFolderUrl(f.area, STATE.dashboard.year||2026)}" target="_blank" rel="noopener">${ICONS.link} Buka Folder Drive</a>
    </div>` : '';

  const rows = docs.map((d,i)=>{
    const pic = getUser(d.picUserId);
    const canEditRow = admin || d.picUserId===u.id;
    const statusPill = d.status==='Lengkap'
      ? `<span class="pill pill-success">${ICONS.check} Lengkap</span>`
      : `<span class="pill pill-danger">${ICONS.alert} Belum Lengkap</span>`;
    const statusCell = admin
      ? `<button class="btn btn-outline btn-sm" onclick="openStatusModal('${d.id}')">${statusPill}</button>`
      : statusPill;
    const catatanCell = d.catatan ? `<span style="color:var(--danger); font-size:12px;">${esc(d.catatan)}</span>` : `<span style="color:var(--text-muted); font-size:12px;">&mdash;</span>`;
    const linkCell = admin
      ? (d.driveLink ? `<a href="${esc(d.driveLink)}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">${ICONS.link} Lihat</a>` : `<span style="color:var(--text-muted); font-size:12px;">&mdash;</span>`)
      : `<span class="pill pill-lock">${ICONS.lock} Admin</span>`;
    return `
    <tr>
      <td>${i+1}</td>
      <td>
        <div style="font-weight:600;">${esc(d.namaDokumen)}</div>
        <div style="font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:4px; margin-top:2px;">${ICONS.file} ${esc(d.fileName||'Belum ada berkas')}</div>
      </td>
      <td><span class="pill pill-area" style="border-left:3px solid ${areaColor(d.area)}; padding-left:7px;">${esc(areaName(d.area))}</span></td>
      <td>${d.tahun}</td>
      <td>${d.tanggalUpload}</td>
      <td>${esc(pic?pic.name:'-')}</td>
      <td>${statusCell}</td>
      <td style="max-width:180px;">${catatanCell}</td>
      ${admin ? `<td>${linkCell}</td>` : ''}
      <td>
        <div style="display:flex; gap:6px;">
          ${canEditRow ? `<button class="btn btn-icon btn-outline" title="Edit" onclick="openDokumenForm('${d.id}')">${ICONS.edit}</button>` : ''}
          ${canEditRow ? `<button class="btn btn-icon btn-danger-outline" title="Hapus" onclick="confirmDeleteDoc('${d.id}')">${ICONS.trash}</button>` : ''}
          ${!canEditRow ? `<span class="pill pill-lock">${ICONS.lock}</span>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="page-desc">${admin ? 'Seluruh dokumen arsip MCSP dari semua area dan organisasi perangkat daerah.' : 'Dokumen arsip MCSP yang Anda input. Pengguna lain pada area yang sama tidak dapat melihat dokumen milik Anda, begitu pula sebaliknya.'}</div>

  ${driveCard}

  <div class="toolbar">
    <div class="search-box grow">
      ${ICONS.search}
      <input type="text" placeholder="Cari nama dokumen atau PIC..." value="${esc(f.search)}" oninput="STATE.dokumen.search=this.value; render();">
    </div>
    <select style="min-width:190px; padding:9px 12px; border:1px solid var(--border-strong); border-radius:8px;" onchange="STATE.dokumen.area=this.value; render();">${areaOptions}</select>
    <select style="min-width:160px; padding:9px 12px; border:1px solid var(--border-strong); border-radius:8px;" onchange="STATE.dokumen.status=this.value; render();">
      <option value="all" ${f.status==='all'?'selected':''}>Semua Status</option>
      <option value="Lengkap" ${f.status==='Lengkap'?'selected':''}>Lengkap</option>
      <option value="Belum Lengkap" ${f.status==='Belum Lengkap'?'selected':''}>Belum Lengkap</option>
    </select>
    <button class="btn btn-gold" onclick="openDokumenForm(null)">${ICONS.plus} Tambah Data</button>
  </div>

  <div class="table-wrap scroll-x">
    <table>
      <thead><tr>
        <th>No</th><th>Nama Dokumen</th><th>Area MCSP</th><th>Tahun</th><th>Tgl Upload</th><th>PIC</th><th>Status</th><th>Catatan</th>${admin?'<th>Link Penyimpanan</th>':''}<th>Aksi</th>
      </tr></thead>
      <tbody>
        ${rows || `<tr><td colspan="${admin?10:9}" class="table-empty">Belum ada dokumen yang sesuai dengan filter.</td></tr>`}
      </tbody>
    </table>
  </div>
  `;
}

function openDokumenForm(id){
  STATE.dokumen.view='form';
  STATE.dokumen.editingId=id;
  STATE.dokumen.tempFile='';
  render();
}
function closeDokumenForm(){
  STATE.dokumen.view='list';
  STATE.dokumen.editingId=null;
  render();
}
function confirmDeleteDoc(id){
  const doc = DB.documents.find(d=>d.id===id);
  if(!doc) return;
  STATE.modal={type:'confirmDeleteDoc', id};
  render();
}
function doDeleteDoc(id){
  const doc = DB.documents.find(d=>d.id===id);
  if(doc){
    DB.documents = DB.documents.filter(d=>d.id!==id);
    logAct('Hapus Dokumen', 'Menghapus dokumen "'+doc.namaDokumen+'" ('+areaName(doc.area)+')');
  }
  STATE.modal=null;
  render();
}

function dokumenFormView(){
  const u=STATE.currentUser;
  const admin=isAdmin(u);
  const editing = STATE.dokumen.editingId ? DB.documents.find(d=>d.id===STATE.dokumen.editingId) : null;
  const myAreas = accessibleAreas(u);
  const areaOptions = myAreas.map(a=>`<option value="${a.id}" ${editing?(editing.area===a.id?'selected':''):''}>${esc(a.name)}</option>`).join('');

  const picName = editing ? (getUser(editing.picUserId)?.name || u.name) : u.name;
  const fileName = STATE.dokumen.tempFile || (editing ? editing.fileName : '');

  return `
  <div class="page-desc">${editing?'Perbarui detail dokumen arsip MCSP.':'Lengkapi detail data untuk menambahkan dokumen arsip MCSP baru.'}</div>
  <div class="card card-pad" style="max-width:720px;">
    <form onsubmit="return saveDokumen(event)">
      <div class="field">
        <label>Area MCSP</label>
        <select id="fArea" required>${areaOptions}</select>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Tanggal Upload</label>
          <div class="locked-field">${ICONS.lock} ${editing?editing.tanggalUpload:todayStr()} <span style="color:var(--text-muted); font-size:11px;">(mengikuti tanggal login)</span></div>
        </div>
        <div class="field">
          <label>Tahun</label>
          <select id="fTahun" required>${yearOptions}</select>
        </div>
      </div>
      <div class="field">
        <label>Nama Dokumen</label>
        <input type="text" id="fNama" placeholder="Contoh: Laporan Realisasi Anggaran Triwulan I" value="${editing?esc(editing.namaDokumen):''}" required>
      </div>
      <div class="field">
        <label>PIC (Penanggung Jawab)</label>
        <div class="locked-field">${ICONS.lock} ${esc(picName)} <span style="color:var(--text-muted); font-size:11px;">(otomatis sesuai akun login)</span></div>
      </div>
      <div class="field">
        <label>Unggah Berkas Dokumen</label>
        <label class="file-drop" for="fFile">
          ${ICONS.upload}<br><br>
          Klik untuk memilih berkas, atau seret berkas ke sini<br>
          <span style="font-size:11px;">PDF, DOCX, XLSX, JPG &middot; maks. 20MB</span>
        </label>
        <input type="file" id="fFile" style="display:none" onchange="onFilePick(this)">
        ${fileName ? `<div class="file-chip">${ICONS.file} ${esc(fileName)}</div>` : ''}
      </div>
      ${admin ? `
      <div class="field">
        <label>Keterangan (Link Penyimpanan Google Drive)</label>
        <input type="text" id="fLink" placeholder="https://drive.google.com/drive/folders/1kqOe9wv5uY45goXNviZ3mMfv7dQyucVK?usp=drive_link" value="${editing?esc(editing.driveLink||''):''}">
        <div class="field-hint">${ICONS.lock} Kolom ini hanya dapat dilihat oleh Admin Utama, tidak ditampilkan kepada pengguna.</div>
      </div>` : `
      <div class="alert alert-info" style="margin-bottom:16px;">${ICONS.info}<span>Link penyimpanan dokumen di Google Drive akan dikelola oleh Admin Utama dan tidak ditampilkan di akun Anda.</span></div>
      `}
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-primary">${ICONS.check} Simpan Dokumen</button>
        <button type="button" class="btn btn-outline" onclick="closeDokumenForm()">Batal</button>
      </div>
    </form>
  </div>
  `;
}
function onFilePick(input){
  if(input.files && input.files[0]){
    STATE.dokumen.tempFile = input.files[0].name;
    render();
  }
}
function saveDokumen(e){
  e.preventDefault();
  const u=STATE.currentUser;
  const admin=isAdmin(u);
  const area=document.getElementById('fArea').value;
  const tahun=parseInt(document.getElementById('fTahun').value);
  const nama=document.getElementById('fNama').value.trim();
  const linkEl=document.getElementById('fLink');
  const link= linkEl ? linkEl.value.trim() : undefined;
  const editing = STATE.dokumen.editingId ? DB.documents.find(d=>d.id===STATE.dokumen.editingId) : null;

  if(editing){
    editing.area=area; editing.tahun=tahun; editing.namaDokumen=nama;
    if(STATE.dokumen.tempFile) editing.fileName=STATE.dokumen.tempFile;
    if(admin && link!==undefined) editing.driveLink=link;
    logAct('Edit Dokumen', 'Memperbarui dokumen "'+nama+'" ('+areaName(area)+')');
  } else {
    const newDoc = {
      id:uid('d'), area, tahun, namaDokumen:nama, tanggalUpload:todayStr(),
      picUserId:u.id, fileName:STATE.dokumen.tempFile||'', driveLink: admin?(link||''):'',
      status:'Belum Lengkap', catatan:''
    };
    DB.documents.push(newDoc);
    logAct('Tambah Dokumen', 'Menambahkan dokumen "'+nama+'" ('+areaName(area)+')');
  }
  STATE.dokumen.view='list';
  STATE.dokumen.editingId=null;
  STATE.dokumen.tempFile='';
  render();
  return false;
}

function openStatusModal(id){
  STATE.modal={type:'status', id};
  render();
}
function saveStatus(id){
  const doc=DB.documents.find(d=>d.id===id);
  if(!doc) return;
  const status=document.getElementById('mStatus').value;
  const catatan=document.getElementById('mCatatan').value.trim();
  doc.status=status;
  doc.catatan= status==='Lengkap' ? '' : catatan;
  logAct('Ubah Status', 'Menandai "'+doc.namaDokumen+'" sebagai '+status);
  STATE.modal=null;
  render();
}

/* ============================================================
   PAGE: LAPORAN
   ============================================================ */
function pageLaporan(){
  const u=STATE.currentUser;
  const admin=isAdmin(u);
  const myAreas = accessibleAreas(u);
  const f=STATE.laporan;
  const year=f.year;

  const areaOptions = `<option value="all">Semua Area</option>` + myAreas.map(a=>`<option value="${a.id}" ${f.area===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const yearOptions = YEARS.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('');
  const areasToShow = f.area==='all' ? myAreas : myAreas.filter(a=>a.id===f.area);

  function countFor(areaId){
    let docs = DB.documents.filter(d=>d.area===areaId && d.tahun===year);
    if(!admin) docs = docs.filter(d=>d.picUserId===u.id);
    return docs.length;
  }

  const rows = areasToShow.map(a=>{
    const realisasi = countFor(a.id);
    const target = getTarget(year, a.id);
    const pct = target>0 ? Math.min(100, Math.round(realisasi/target*100)) : 0;
    return {a, realisasi, target, pct};
  });

  const totalRealisasi = rows.reduce((s,r)=>s+r.realisasi,0);
  const totalTarget = rows.reduce((s,r)=>s+r.target,0);
  const totalPct = totalTarget>0 ? Math.min(100, Math.round(totalRealisasi/totalTarget*100)) : 0;

  const tableRows = rows.map(r=>`
    <tr>
      <td><span class="pill pill-area" style="border-left:3px solid ${r.a.color}; padding-left:7px;">${esc(r.a.name)}</span></td>
      <td>${r.realisasi}</td>
      <td>
        ${admin ? `<span id="targetDisplay_${r.a.id}">${r.target}</span> <button class="btn btn-icon btn-outline btn-sm" style="margin-left:6px;" onclick="editTarget('${r.a.id}')">${ICONS.edit}</button>` : r.target}
      </td>
      <td><b style="color:${r.pct>=100?'var(--success)':'var(--text-primary)'}">${r.pct}%</b></td>
    </tr>`).join('');

  const barsHtml = rows.map(r=>`
    <div class="rep-bar-row">
      <div class="rep-bar-label">${esc(r.a.name)}</div>
      <div class="rep-bar-track"><div class="rep-bar-fill" style="width:${r.pct}%; background:${r.a.color};"></div></div>
      <div class="rep-bar-num">${r.realisasi} / ${r.target}</div>
    </div>`).join('');

  const printTitle = f.area==='all' ? 'Semua Area MCSP' : areaName(f.area);

  return `
  <div class="page-desc">${admin ? 'Rekapitulasi jumlah dokumen terinput dibandingkan target per area MCSP.' : 'Rekapitulasi dokumen yang Anda input dibandingkan target area MCSP Anda.'}</div>

  <div class="toolbar no-print">
    <div class="field" style="margin-bottom:0; min-width:220px;">
      <label>Area MCSP</label>
      <select onchange="STATE.laporan.area=this.value; render();">${areaOptions}</select>
    </div>
    <div class="field" style="margin-bottom:0; min-width:140px;">
      <label>Tahun</label>
      <select onchange="STATE.laporan.year=parseInt(this.value); render();">${yearOptions}</select>
    </div>
    <div style="flex:1"></div>
    ${admin ? `<button class="btn btn-outline" onclick="openTargetManager()">${ICONS.edit} Kelola Semua Target</button>` : ''}
    <button class="btn btn-gold" onclick="window.print()">${ICONS.download} Unduh Laporan (PDF)</button>
  </div>

  <div class="grid grid-3" style="margin-bottom:20px;">
    <div class="card stat-card"><div class="stat-label">Total Target ${year}</div><div class="stat-value">${totalTarget}</div></div>
    <div class="card stat-card"><div class="stat-label">Total Terinput</div><div class="stat-value">${totalRealisasi}</div></div>
    <div class="card stat-card"><div class="stat-label">Capaian</div><div class="stat-value">${totalPct}%</div></div>
  </div>

  <div id="reportPrintArea">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px; border-bottom:2px solid var(--navy); padding-bottom:12px;">
      <div style="width:38px;height:38px;border-radius:9px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';font-weight:800;">DM</div>
      <div>
        <div style="font-weight:800; font-size:16px; color:var(--navy);">Laporan DiMAS &mdash; Digitalisasi MCSP Arsip Sistem</div>
        <div style="font-size:12px; color:var(--text-secondary);">Area: ${esc(printTitle)} &middot; Tahun: ${year} &middot; Dicetak: ${todayStr()} oleh ${esc(u.name)}</div>
      </div>
    </div>

    <div class="section-title">Tabel Rekapitulasi</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Area MCSP</th><th>Realisasi</th><th>Target</th><th>Capaian</th></tr></thead>
        <tbody>${tableRows || `<tr><td colspan="4" class="table-empty">Tidak ada data.</td></tr>`}</tbody>
      </table>
    </div>

    <div class="section-title">Diagram Realisasi vs Target</div>
    <div class="card card-pad">
      ${barsHtml || '<div class="table-empty">Tidak ada data untuk ditampilkan.</div>'}
    </div>
  </div>
  `;
}
function editTarget(areaId){
  STATE.modal={type:'target', areaId};
  render();
}
function saveTarget(areaId){
  const val = parseInt(document.getElementById('mTargetVal').value)||0;
  setTarget(STATE.laporan.year, areaId, val);
  logAct('Edit Target Laporan', 'Mengubah target '+areaName(areaId)+' tahun '+STATE.laporan.year+' menjadi '+val);
  STATE.modal=null;
  render();
}
function openTargetManager(){
  STATE.modal={type:'targetManager'};
  render();
}
function saveAllTargets(){
  const year=STATE.laporan.year;
  const changes=[];
  AREAS.forEach(a=>{
    const el=document.getElementById('mtAll_'+a.id);
    if(!el) return;
    const val=parseInt(el.value)||0;
    const before=getTarget(year,a.id);
    if(val!==before) changes.push(areaName(a.id)+': '+before+' -> '+val);
    setTarget(year, a.id, val);
  });
  if(changes.length){
    logAct('Edit Target Laporan', 'Memperbarui target tahun '+year+' ('+changes.join(', ')+')');
  }
  STATE.modal=null;
  render();
}

/* ============================================================
   PAGE: PENGGUNA (admin only)
   ============================================================ */
function pagePengguna(){
  if(STATE.pengguna.view==='form') return penggunaFormView();
  const rows = DB.users.map((usr,i)=>{
    const revealed = STATE.pengguna.revealed[usr.id];
    const areaChips = usr.role==='admin' ? `<span class="chip" style="background:var(--gold-bg); color:var(--gold-dark); border-color:transparent;">Seluruh Area</span>` :
      usr.areas.map(aid=>`<span class="chip">${esc(areaName(aid))}</span>`).join('') || '<span style="color:var(--text-muted); font-size:11.5px;">Belum ada area</span>';
    return `
    <tr>
      <td>${i+1}</td>
      <td><b>${esc(usr.username)}</b></td>
      <td>${esc(usr.name)}</td>
      <td>${esc(usr.organisasi)}</td>
      <td><span class="badge-role ${usr.role}">${usr.role==='admin'?'ADMIN UTAMA':'PENGGUNA'}</span></td>
      <td style="max-width:260px;">${areaChips}</td>
      <td>
        <span class="mono">${revealed ? esc(usr.password) : '•'.repeat(Math.min(usr.password.length,10))}</span>
        <button class="eye-btn" onclick="togglePassReveal('${usr.id}')">${revealed?ICONS.eyeOff:ICONS.eye}</button>
      </td>
      <td>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-icon btn-outline" title="Edit" onclick="openUserForm('${usr.id}')">${ICONS.edit}</button>
          ${usr.id!==STATE.currentUser.id ? `<button class="btn btn-icon btn-danger-outline" title="Hapus" onclick="confirmDeleteUser('${usr.id}')">${ICONS.trash}</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="page-desc">Kelola akun pengguna, hak akses area MCSP, dan organisasi perangkat daerah. Hanya Admin Utama (Inspektorat) yang dapat mengelola halaman ini.</div>
  <div class="toolbar">
    <div style="flex:1"></div>
    <button class="btn btn-gold" onclick="openUserForm(null)">${ICONS.plus} Tambah Pengguna</button>
  </div>
  <div class="table-wrap scroll-x">
    <table>
      <thead><tr><th>No</th><th>Username</th><th>Nama</th><th>Organisasi</th><th>Role</th><th>Area Akses</th><th>Password</th><th>Aksi</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  `;
}
function togglePassReveal(id){
  STATE.pengguna.revealed[id]=!STATE.pengguna.revealed[id];
  render();
}
function openUserForm(id){
  STATE.pengguna.view='form';
  STATE.pengguna.editingId=id;
  render();
}
function closeUserForm(){
  STATE.pengguna.view='list';
  STATE.pengguna.editingId=null;
  render();
}
function confirmDeleteUser(id){
  STATE.modal={type:'confirmDeleteUser', id};
  render();
}
function doDeleteUser(id){
  const usr=DB.users.find(x=>x.id===id);
  if(usr){
    DB.users=DB.users.filter(x=>x.id!==id);
    logAct('Hapus Pengguna', 'Menghapus akun pengguna "'+usr.username+'"');
  }
  STATE.modal=null;
  render();
}

function penggunaFormView(){
  const editing = STATE.pengguna.editingId ? DB.users.find(x=>x.id===STATE.pengguna.editingId) : null;
  const role = editing ? editing.role : 'user';
  const orgOptions = ORGANISASI.map(o=>`<option value="${esc(o)}" ${editing&&editing.organisasi===o?'selected':''}>${esc(o)}</option>`).join('');
  const areaChecks = AREAS.map(a=>{
    const checked = editing ? editing.areas.includes(a.id) : false;
    return `<label class="check-item"><input type="checkbox" class="areaChk" value="${a.id}" ${checked?'checked':''}> ${esc(a.name)}</label>`;
  }).join('');

  return `
  <div class="page-desc">${editing?'Perbarui data pengguna dan hak akses area MCSP.':'Tambahkan akun pengguna baru beserta organisasi dan area MCSP yang dapat diakses.'}</div>
  <div class="card card-pad" style="max-width:640px;">
    <form onsubmit="return saveUserForm(event)">
      <div class="form-row">
        <div class="field">
          <label>Username</label>
          <input type="text" id="uUsername" value="${editing?esc(editing.username):''}" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="text" id="uPassword" value="${editing?esc(editing.password):''}" required>
        </div>
      </div>
      <div class="field">
        <label>Nama Lengkap</label>
        <input type="text" id="uName" value="${editing?esc(editing.name):''}" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Organisasi Perangkat Daerah</label>
          <select id="uOrg" required>${orgOptions}</select>
        </div>
        <div class="field">
          <label>Role</label>
          <select id="uRole" onchange="onRoleChange(this.value)">
            <option value="user" ${role==='user'?'selected':''}>Pengguna</option>
            <option value="admin" ${role==='admin'?'selected':''}>Admin Utama</option>
          </select>
        </div>
      </div>
      <div class="field" id="areaAccessField" style="${role==='admin'?'display:none;':''}">
        <label>Area MCSP yang Dapat Diakses</label>
        <div class="check-grid">${areaChecks}</div>
        <div class="field-hint">Pengguna hanya dapat melihat dan mengelola dokumen pada area yang dicentang, dan hanya dokumen miliknya sendiri.</div>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-primary">${ICONS.check} Simpan Pengguna</button>
        <button type="button" class="btn btn-outline" onclick="closeUserForm()">Batal</button>
      </div>
    </form>
  </div>
  `;
}
function onRoleChange(val){
  document.getElementById('areaAccessField').style.display = val==='admin' ? 'none':'block';
}
function saveUserForm(e){
  e.preventDefault();
  const username=document.getElementById('uUsername').value.trim();
  const password=document.getElementById('uPassword').value;
  const name=document.getElementById('uName').value.trim();
  const organisasi=document.getElementById('uOrg').value;
  const role=document.getElementById('uRole').value;
  const areasChecked = Array.from(document.querySelectorAll('.areaChk:checked')).map(c=>c.value);
  const areas = role==='admin' ? AREAS.map(a=>a.id) : areasChecked;

  const dupe = DB.users.find(x=>x.username===username && x.id!==STATE.pengguna.editingId);
  if(dupe){ alert('Username sudah digunakan oleh pengguna lain.'); return false; }

  const editing = STATE.pengguna.editingId ? DB.users.find(x=>x.id===STATE.pengguna.editingId) : null;
  if(editing){
    editing.username=username; editing.password=password; editing.name=name;
    editing.organisasi=organisasi; editing.role=role; editing.areas=areas;
    logAct('Edit Pengguna', 'Memperbarui akun pengguna "'+username+'"');
    if(STATE.currentUser.id===editing.id) STATE.currentUser=editing;
  } else {
    DB.users.push({id:uid('u'), username, password, name, role, organisasi, areas});
    logAct('Tambah Pengguna', 'Menambahkan akun pengguna baru "'+username+'"');
  }
  STATE.pengguna.view='list';
  STATE.pengguna.editingId=null;
  render();
  return false;
}

/* ============================================================
   PAGE: RIWAYAT AKTIVITAS (admin only)
   ============================================================ */
function pageRiwayat(){
  const q = STATE.riwayat.search.trim().toLowerCase();
  let list = DB.activity;
  if(q) list = list.filter(a => a.user.toLowerCase().includes(q) || a.aksi.toLowerCase().includes(q) || a.detail.toLowerCase().includes(q));

  const rows = list.map(a=>`
    <tr>
      <td style="white-space:nowrap; color:var(--text-secondary);">${a.waktu}</td>
      <td><b>${esc(a.user)}</b></td>
      <td><span class="chip">${esc(a.aksi)}</span></td>
      <td>${esc(a.detail)}</td>
    </tr>`).join('');

  return `
  <div class="page-desc">Catatan seluruh aktivitas pengguna di dalam sistem DiMAS.</div>
  <div class="toolbar">
    <div class="search-box grow">
      ${ICONS.search}
      <input type="text" placeholder="Cari berdasarkan pengguna, aksi, atau detail..." value="${esc(STATE.riwayat.search)}" oninput="STATE.riwayat.search=this.value; render();">
    </div>
  </div>
  <div class="table-wrap scroll-x">
    <table>
      <thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Detail</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" class="table-empty">Belum ada aktivitas tercatat.</td></tr>`}</tbody>
    </table>
  </div>
  `;
}

/* ============================================================
   MODALS
   ============================================================ */
function closeModal(){STATE.modal=null; render();}
function renderModal(){
  const m=STATE.modal;
  let inner='';
  if(m.type==='status'){
    const doc=DB.documents.find(d=>d.id===m.id);
    inner=`
      <div class="modal-head"><h3>Kelengkapan Dokumen</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="field-hint" style="margin-bottom:14px; font-size:12.5px;">Dokumen: <b style="color:var(--text-primary)">${esc(doc.namaDokumen)}</b></div>
        <div class="field">
          <label>Status Kelengkapan</label>
          <select id="mStatus">
            <option value="Lengkap" ${doc.status==='Lengkap'?'selected':''}>Lengkap</option>
            <option value="Belum Lengkap" ${doc.status==='Belum Lengkap'?'selected':''}>Belum Lengkap</option>
          </select>
        </div>
        <div class="field">
          <label>Catatan untuk Pengguna</label>
          <textarea id="mCatatan" rows="3" placeholder="Jelaskan berkas apa saja yang belum lengkap...">${esc(doc.catatan)}</textarea>
          <div class="field-hint">Catatan ini akan tampil kepada pengguna terkait pada Data Dokumen.</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveStatus('${doc.id}')">Simpan</button>
      </div>`;
  } else if(m.type==='target'){
    const cur = getTarget(STATE.laporan.year, m.areaId);
    inner=`
      <div class="modal-head"><h3>Ubah Target Dokumen</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="field-hint" style="margin-bottom:14px; font-size:12.5px;">${esc(areaName(m.areaId))} &middot; Tahun ${STATE.laporan.year}</div>
        <div class="field">
          <label>Target Jumlah Dokumen</label>
          <input type="number" id="mTargetVal" min="0" value="${cur}">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveTarget('${m.areaId}')">Simpan</button>
      </div>`;
  } else if(m.type==='targetManager'){
    const year=STATE.laporan.year;
    const rowsHtml = AREAS.map(a=>`
      <div class="form-row" style="align-items:center; grid-template-columns:1fr 120px; margin-bottom:10px;">
        <div style="font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px;">
          <span style="width:8px; height:8px; border-radius:50%; background:${a.color}; flex-shrink:0; display:inline-block;"></span>
          ${esc(a.name)}
        </div>
        <input type="number" min="0" id="mtAll_${a.id}" value="${getTarget(year,a.id)}">
      </div>`).join('');
    inner=`
      <div class="modal-head"><h3>Kelola Semua Target</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="field-hint" style="margin-bottom:16px; font-size:12.5px;">Atur target jumlah dokumen untuk seluruh area MCSP pada tahun ${year}.</div>
        ${rowsHtml}
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveAllTargets()">Simpan Semua</button>
      </div>`;
  } else if(m.type==='confirmDeleteDoc'){
    const doc=DB.documents.find(d=>d.id===m.id);
    inner=`
      <div class="modal-head"><h3>Hapus Dokumen</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="alert alert-warn">${ICONS.alert}<span>Anda yakin ingin menghapus dokumen "<b>${esc(doc.namaDokumen)}</b>"? Tindakan ini tidak dapat dibatalkan.</span></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" style="background:var(--danger);" onclick="doDeleteDoc('${doc.id}')">Ya, Hapus</button>
      </div>`;
  } else if(m.type==='confirmDeleteUser'){
    const usr=DB.users.find(x=>x.id===m.id);
    inner=`
      <div class="modal-head"><h3>Hapus Pengguna</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="alert alert-warn">${ICONS.alert}<span>Anda yakin ingin menghapus akun "<b>${esc(usr.username)}</b>" (${esc(usr.name)})? Dokumen yang sudah diinput oleh pengguna ini akan tetap tersimpan.</span></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" style="background:var(--danger);" onclick="doDeleteUser('${usr.id}')">Ya, Hapus</button>
      </div>`;
  }
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal-box">${inner}</div></div>`;
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  const root=document.getElementById('root');
  root.innerHTML = STATE.currentUser ? renderShell() : renderLogin();
}
window.addEventListener('resize', ()=>{ /* keep layout responsive without forcing re-render loops */ });
render();
</script>
